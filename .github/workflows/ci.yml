name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.32
      # uv.lock pins every package; --locked fails if it is out of date.
      - name: Install the locked environment
        run: uv sync --locked --all-extras --python "3.13"
      - name: Put the environment on PATH
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then dir=.venv/Scripts; else dir=.venv/bin; fi
          echo "$GITHUB_WORKSPACE/$dir" >> "$GITHUB_PATH"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Pyright
        run: pyright

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.11.32
      # uv.lock pins every package; --locked fails if it is out of date.
      - name: Install the locked environment
        run: uv sync --locked --all-extras --python "${{ matrix.python-version }}"
      - name: Put the environment on PATH
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then dir=.venv/Scripts; else dir=.venv/bin; fi
          echo "$GITHUB_WORKSPACE/$dir" >> "$GITHUB_PATH"
      - name: Validate evaluation set
        run: python demo/validate_eval_set.py
      - name: Run tests
        run: python -m pytest -q

  core-only:
    name: Core install without extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # No extras: the gate, the engine and the stdlib provider path must
      # work with zero third-party packages (ADR 0002).
      - name: Install the core only
        run: python -m pip install .
      - name: No third-party package is installed or imported
        run: |
          python - <<'PY'
          import importlib, importlib.metadata as md, sys
          extra = sorted(d.metadata["Name"] for d in md.distributions()
                         if d.metadata["Name"].lower() not in {"aire", "pip", "setuptools", "wheel"})
          if extra:
              raise SystemExit(f"unexpected packages installed: {extra}")
          for name in ("aire.providers.client", "aire.providers.local", "aire.runner.async_runner",
                       "aire.systems.rag", "aire.evaluator.engine", "aire.regression.gate"):
              importlib.import_module(name)
          print("core imports fine with no third-party packages")
          PY
      - name: Gate the committed runs with the core install
        run: |
          aire-gate results/v1_baseline results/v2_improved --ignore latency_ms
          code=0; aire-gate results/v1_baseline results/v3_fluent_regression --ignore latency_ms || code=$?
          test "$code" -eq 1

  eval-gate:
    name: Evaluation regression gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.32
      # uv.lock pins every package; --locked fails if it is out of date.
      - name: Install the locked environment
        run: uv sync --locked --python "3.13"
      - name: Put the environment on PATH
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then dir=.venv/Scripts; else dir=.venv/bin; fi
          echo "$GITHUB_WORKSPACE/$dir" >> "$GITHUB_PATH"
      - name: Snapshot the committed results
        run: cp -r results "$RUNNER_TEMP/committed-results"
      - name: Regenerate the three-version demo
        run: python demo/run_demo.py
      # Sub-millisecond latencies of the offline demo are noise on shared CI
      # runners, so latency is reported but not gated here. Gate it for a real
      # system with e.g. --override latency_ms=0.5 instead of --ignore.
      - name: Gate the fresh v2 against the committed v2 snapshot (must pass)
        run: aire-gate "$RUNNER_TEMP/committed-results/v2_improved" results/v2_improved --ignore latency_ms --report gate-v2-snapshot.json
      - name: Gate v2 against v1 (must pass)
        run: aire-gate results/v1_baseline results/v2_improved --ignore latency_ms --report gate-v2.json
      - name: Gate v3 against v1 (must be blocked)
        run: |
          code=0
          aire-gate results/v1_baseline results/v3_fluent_regression --ignore latency_ms --report gate-v3.json || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::expected the gate to block v3 with exit code 1, got $code"
            exit 1
          fi
          # Exit 1 alone could hide a different failure; check what was blocked.
          python - <<'PY'
          import json
          rows = json.load(open("gate-v3.json", encoding="utf-8"))["metrics"]
          regressed = {r["metric"] for r in rows if r["verdict"] == "regressed" and r["gated"]}
          missing = {"groundedness", "gold_citation_recall"} - regressed
          if missing:
              raise SystemExit(f"v3 was blocked, but not for {sorted(missing)}: {sorted(regressed)}")
          print("Seeded regression blocked for:", ", ".join(sorted(regressed)))
          PY
      - name: Rebuild the judge calibration report (offline, deterministic)
        run: python demo/judge_calibration/calibrate_judges.py
      - name: Rebuild the demo-site data
        run: python demo-site/build.py
      - name: Fail if a number in the docs no longer matches the results
        run: python scripts/sync_docs.py --check
      - name: Fail if generated artifacts drifted from the commit
        run: git diff --exit-code -- results reports demo-site/data.js
      - name: Upload gate reports and HTML dashboards
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aire-gate-reports
          path: |
            gate-*.json
            reports/*.html
