name: Comment the PR gate result

# Posts or updates one sticky comment with the result of "Eval PR". It runs
# from the default branch with a write token and never checks out or runs
# pull request code, so fork PRs get comments safely (ADR 0005):
# - the artifact is untrusted data: the PR number is reduced to digits, the
#   gate JSON is schema-checked and every string in it is sanitised when the
#   trusted aire renders the markdown;
# - the comment is only posted if the PR's current head commit is the commit
#   GitHub says was evaluated (workflow_run.head_sha), so a forged PR number
#   cannot redirect the comment to another pull request.

on:
  workflow_run:
    workflows: ["Eval PR"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    name: Post or update the comment
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch (trusted code only)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install aire from the default branch
        run: python -m pip install .
      - name: Download the evaluation result
        uses: actions/download-artifact@v8
        with:
          name: aire-pr-gate
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Render and post the comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          pr="$(tr -cd '0-9' < artifact/pr_number.txt | head -c 10)"
          if [ -z "$pr" ]; then
            echo "::error::the artifact carries no pull request number"
            exit 1
          fi
          if [ ! -f artifact/gate.json ]; then
            echo "::warning::the evaluation produced no gate result; nothing to post"
            exit 0
          fi
          aire markdown artifact/gate.json --out comment.md \
            --title "v2_improved against the base branch" --details-url "$RUN_URL"
          aire pr-comment --repo "$REPO" --pr "$pr" --body-file comment.md --head-sha "$HEAD_SHA"
